[project]
name = "malt-radar-aggregator"
version = "0.1.0"
description = "VPS-side aggregator for Malt-Radar: HTTP API consumed by the Pi5 worker (Phase 2) and, later, the Phase 3 weekly synthesis"
requires-python = ">=3.11"
dependencies = [
    "fastapi",
    "uvicorn[standard]",
]

[project.optional-dependencies]
dev = ["pytest", "httpx"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/malt_radar_aggregator"]
