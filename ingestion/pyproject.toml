[project]
name = "malt-radar-ingestion"
version = "0.1.0"
description = "Ingestion service for Malt-Radar: scraping Free-Work/Comet + France Travail API"
requires-python = ">=3.12"
dependencies = [
    "playwright",
    "httpx",
]

[project.optional-dependencies]
dev = ["pytest"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/malt_radar_ingestion"]
