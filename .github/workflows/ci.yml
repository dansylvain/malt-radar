name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test-ingestion:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install -e ".[dev]"
        working-directory: ingestion
      - run: pytest -q
        working-directory: ingestion

  test-aggregator:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install -e ../ingestion -e ".[dev]"
        working-directory: aggregator
      - run: pytest -q
        working-directory: aggregator

  test-worker:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install -e ".[dev]"
        working-directory: worker
      - run: pytest -q
        working-directory: worker

  test-tui:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - run: cargo test
        working-directory: tui
      - run: cargo clippy --all-targets -- -D warnings
        working-directory: tui
